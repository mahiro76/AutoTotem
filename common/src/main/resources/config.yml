# AutoTotem Config
# Whether players enable automatic totems by default
default-enabled: true
# Default trigger cooling time (unit: tick, 20 tick = 1 second)
default-cooldown-ticks: 0
# Whether to trigger the automatic totem when being attacked by a player causing fatal damage (PVP scenario)
pvp-enabled: true
# Default language (used when the player client language is not in the lang/ directory, such as en-US, zh-CN)
default-locale: en-US