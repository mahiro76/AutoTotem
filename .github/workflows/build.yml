name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 项目使用 Gradle toolchain：common/paper-1-20=17，paper-1-21=21，paper-26-1/26-2/根=25
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 覆盖本地 gradle.properties 中指向本机 JDK 的路径，改为 CI 安装的 JDK
      - name: Configure Gradle toolchain paths
        run: |
          sed -i '/^org.gradle.java.installations.paths/d' gradle.properties
          echo "org.gradle.java.installations.paths=${JAVA_HOME_17_X64},${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" >> gradle.properties
          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoTotem-jar
          path: build/libs/*.jar
          if-no-files-found: error
