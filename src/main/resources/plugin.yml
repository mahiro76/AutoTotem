name: AutoTotem
version: '${version}'

main: top.mahiro76.autoTotem.AutoTotem
api-version: '1.20'
load: POSTWORLD

commands:
  autototem:
    description: AutoTotem 主命令
    usage: /autototem <enabled|cooldowntime|help>
    permission: autototem.use
    aliases: [at]

permissions:
  autototem.use:
    description: Allow to use AutoTotem command.
    default: true

  autototem.admin:
    description: Allow to use AutoTotem admin command.
    default: op

  autototem.reload:
    description: Allow to reload AutoTotem config.
    default: op
