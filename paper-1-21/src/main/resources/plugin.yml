name: AutoTotem
version: '${version}'

main: top.mahiro76.autoTotem.AutoTotem
api-version: '1.21'
load: POSTWORLD

commands:
  autototem:
    description: AutoTotem 主命令
    usage: /autototem <enabled|cooldowntime|help>
    permission: autototem.use

permissions:
  autototem.use:
    description: Allow to use AutoTotem command.
    default: true
